name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  APP_NAME: "BNFE Training"
  APP_ID: "com.bnfe.training"   # use the SAME id as your current APK, or phones treat it as a different app
  CAP_VERSION: "7"              # use the same major version as your current @capacitor/core

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor packages (including geolocation)
        run: |
          npm install @capacitor/core@${CAP_VERSION} @capacitor/android@${CAP_VERSION} @capacitor/geolocation@${CAP_VERSION}
          npm install -D @capacitor/cli@${CAP_VERSION}

      - name: Build web app
        run: npm run build

      - name: Create Capacitor config if missing
        run: |
          ls capacitor.config.* >/dev/null 2>&1 || npx cap init "$APP_NAME" "$APP_ID" --web-dir=dist

      - name: Add Android project if missing
        run: |
          [ -d android ] || npx cap add android

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Add location permissions to AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          echo "---- location entries in manifest ----"
          grep -n "LOCATION\|location.gps" "$M"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bnfe-training-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
